<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lurchi-Adventskalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Grundtöne */
    --bg: #fbf6f1;
    --white: #ffffff;
    --ink: #2b3a33;
    --muted: #6f7f76;

    /* Pastell-Grün */
    --mint-50: #f0f8f3;
    --mint: #d4ecdc;
    --mint-2: #b3dbc1;
    --sage: #6fa786;
    --green-ink: #2f5a45;

    /* Pastell-Rot */
    --blush-50: #fdf1f0;
    --blush: #f8d7d5;
    --rose: #f0a7a4;
    --rose-strong: #e3817d;
    --red-ink: #b94a47;

    /* Unterstützende Farben */
    --butter-50: #fffaeb;
    --butter: #f9e8b6;
    --sky: #d9edf5;
    --sky-ink: #3f6f86;

    --shadow-soft: 0 10px 30px rgba(47, 90, 69, .10);
    --shadow-lift: 0 16px 40px rgba(47, 90, 69, .16);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow-x: hidden;
    padding: 54px 16px 64px;
  }

  /* Farbverlauf als feste Ebene: wird einmal gemalt statt bei jedem Scrollen */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 45% at 8% 0%, rgba(248, 215, 213, .75), transparent 70%),
      radial-gradient(55% 40% at 100% 10%, rgba(212, 236, 220, .85), transparent 70%),
      radial-gradient(70% 45% at 50% 110%, rgba(217, 237, 245, .9), transparent 70%);
  }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  /* ---------- Lichterkette ---------- */
  .lights {
    position: fixed; top: 0; left: 0; right: 0; height: 40px; z-index: 5;
    display: flex; justify-content: space-around; pointer-events: none;
  }
  .lights::before {
    content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 30px;
    border-bottom: 2px solid #c6d9cd; border-radius: 0 0 50% 50% / 0 0 100% 100%;
  }
  .lights span {
    width: 11px; height: 17px; margin-top: 12px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: relative; animation: blink 2.2s infinite alternate ease-in-out; will-change: opacity;
    background: var(--c); box-shadow: 0 3px 14px 2px var(--c);
  }
  .lights span::before {
    content: ""; position: absolute; top: -4px; left: 3px; width: 5px; height: 5px;
    background: #9fb8aa; border-radius: 2px;
  }
  .lights span:nth-child(4n+1) { --c: #f3a3a0; }
  .lights span:nth-child(4n+2) { --c: #f6dc8f; animation-delay: .5s; }
  .lights span:nth-child(4n+3) { --c: #9fd6b2; animation-delay: 1s; }
  .lights span:nth-child(4n+4) { --c: #a9d6ea; animation-delay: 1.5s; }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: .45; } }

  /* ---------- Kopf ---------- */
  .hero {
    position: relative; z-index: 1;
    max-width: 960px; margin: 0 auto 26px;
    display: grid; align-items: center; gap: 8px 18px;
    grid-template-columns: 1fr minmax(0, 2fr) 1fr;
    grid-template-areas: "l1 text l2";
  }
  .hero-text { grid-area: text; text-align: center; }
  .hero-lurch { width: 100%; max-width: 220px; height: auto; justify-self: center; filter: drop-shadow(0 12px 14px rgba(47, 90, 69, .18)); }
  .hero-lurch.l1 { grid-area: l1; animation: float 5s ease-in-out infinite; }
  .hero-lurch { will-change: transform; }
  .hero-lurch.l2 { grid-area: l2; max-width: 250px; animation: float 5.5s ease-in-out infinite .8s; }
  @keyframes float { 50% { transform: translateY(-8px) rotate(-2deg); } }

  .eyebrow {
    display: inline-block; font-weight: 800; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--red-ink); background: var(--blush); padding: 5px 12px; border-radius: 999px;
  }
  h1 {
    font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; font-weight: 700;
    font-size: clamp(1.7rem, 4.2vw, 2.6rem); line-height: 1.05; letter-spacing: -.01em;
    margin: 12px 0 8px; color: var(--green-ink);
  }
  h1 span { color: var(--rose-strong); display: block; }
  .subtitle { color: var(--muted); font-size: 1.08rem; margin: 0; }
  .countdown {
    display: inline-block; margin-top: 14px; font-weight: 800; color: var(--green-ink);
    background: var(--white); padding: 8px 16px; border-radius: 999px; box-shadow: var(--shadow-soft);
  }
  .countdown:empty { display: none; }
  @media (max-width: 700px) {
    .hero { grid-template-columns: 1fr 1fr; grid-template-areas: "text text" "l1 l2"; }
    .hero-lurch { max-width: 150px; }
    .hero-lurch.l2 { max-width: 175px; }
  }

  /* ---------- Kalender ---------- */
  .cal-wrap { position: relative; max-width: 960px; margin: 0 auto; }
  .calendar {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-flow: dense;
    gap: 14px;
    padding: 22px;
    border-radius: 32px;
    background: rgba(255, 255, 255, .78);
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow: var(--shadow-lift);
  }
  @media (max-width: 700px) { .calendar { grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px; border-radius: 24px; } }
  @media (max-width: 420px) { .calendar { grid-template-columns: repeat(3, 1fr); } }

  .slot { aspect-ratio: 1 / 1; perspective: 900px; position: relative; }
  .slot.big { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; }

  .inside {
    position: absolute; inset: 0; border-radius: var(--radius);
    background: var(--white);
    border: 2px dashed var(--mint-2);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.8rem, 5vw, 2.5rem);
  }
  .slot.big .inside { font-size: clamp(3rem, 9vw, 4.6rem); }

  .door {
    position: absolute; inset: 0; border: none; padding: 0; cursor: pointer;
    border-radius: var(--radius); background: none;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.6,-0.1,.3,1.2), opacity .3s;
    font: inherit; color: inherit;
  }
  .door .face, .door .back {
    position: absolute; inset: 0; border-radius: var(--radius);
    backface-visibility: hidden; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* Farbvarianten + Lurch-Punkte als Muster */
  .door .face {
    --bgc: var(--mint); --spot: rgba(111, 167, 134, .28); --num: var(--green-ink);
    background:
      radial-gradient(circle at 80% 20%, var(--spot) 0 6%, transparent 6.5%),
      radial-gradient(circle at 90% 36%, var(--spot) 0 3.5%, transparent 4%),
      radial-gradient(circle at 70% 33%, var(--spot) 0 2.5%, transparent 3%),
      radial-gradient(circle at 14% 84%, var(--spot) 0 4%, transparent 4.5%),
      linear-gradient(160deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 55%),
      var(--bgc);
    box-shadow: 0 6px 16px rgba(47, 90, 69, .12), inset 0 0 0 1px rgba(255, 255, 255, .7);
  }
  .slot.c-blush  .door .face { --bgc: var(--blush);  --spot: rgba(227, 129, 125, .28); --num: var(--red-ink); }
  .slot.c-white  .door .face { --bgc: #ffffff;       --spot: rgba(111, 167, 134, .22); --num: var(--green-ink); }
  .slot.c-butter .door .face { --bgc: var(--butter); --spot: rgba(214, 170, 60, .25);  --num: #8a6514; }
  .slot.c-sky    .door .face { --bgc: var(--sky);    --spot: rgba(63, 111, 134, .18);  --num: var(--sky-ink); }
  .slot.c-rose   .door .face { --bgc: var(--rose);   --spot: rgba(255, 255, 255, .35); --num: #ffffff; }
  .door .back {
    background: var(--mint-50);
    transform: rotateY(180deg);
  }
  .num {
    font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; font-weight: 600;
    font-size: clamp(1.5rem, 4.6vw, 2.3rem);
    color: var(--num);
    position: relative; z-index: 1;
  }
  /* Große Türen (6 und 24): kräftigerer Verlauf, große Zahl, Unterzeile */
  .slot.big .door .face {
    flex-direction: column; gap: 4px;
    background:
      radial-gradient(circle at 82% 18%, rgba(255, 255, 255, .35) 0 9%, transparent 9.5%),
      radial-gradient(circle at 90% 34%, rgba(255, 255, 255, .3) 0 5%, transparent 5.5%),
      radial-gradient(circle at 14% 86%, rgba(255, 255, 255, .3) 0 7%, transparent 7.5%),
      radial-gradient(circle at 24% 74%, rgba(255, 255, 255, .25) 0 3.5%, transparent 4%),
      linear-gradient(145deg, var(--g1), var(--g2));
    box-shadow: 0 10px 26px rgba(47, 90, 69, .18), inset 0 0 0 6px rgba(255, 255, 255, .45);
  }
  .slot.big.b-rose .door .face { --g1: #f6bdba; --g2: #e3817d; }
  .slot.big.b-mint .door .face { --g1: #bfe3cb; --g2: #6fa786; }
  .slot.big .num { font-size: clamp(3rem, 10vw, 5.4rem); color: #ffffff; text-shadow: 0 3px 12px rgba(0, 0, 0, .12); line-height: 1; }
  .big-label {
    position: relative; z-index: 1;
    font-weight: 800; font-size: clamp(.7rem, 1.8vw, .9rem); letter-spacing: .16em; text-transform: uppercase;
    color: #ffffff; background: rgba(255, 255, 255, .22); padding: 5px 12px; border-radius: 999px;
  }
  .door:hover:not([disabled]) { transform: rotateY(-12deg) translateY(-2px); }
  .door:focus-visible { outline: 3px solid var(--rose-strong); outline-offset: 3px; }
  /* Nach dem Öffnen: Tür schwingt auf und verschwindet, damit sie keine Nachbartüren verdeckt */
  .slot.open .door {
    transform: rotateY(-115deg); opacity: 0; pointer-events: none;
    transition: transform .9s cubic-bezier(.6,-0.1,.3,1.2), opacity .35s ease .55s;
  }
  /* Während des Auf-/Zuschwingens bleibt die Tür in ihrem Feld und überdeckt keine Nachbartüren */
  .slot.swing { clip-path: inset(0 round var(--radius)); z-index: 2; }
  .slot.open .inside { cursor: pointer; transition: transform .2s, border-color .2s; }
  .slot.open .inside:hover { transform: scale(1.04); border-color: var(--rose); }
  .slot.today::after {
    content: ""; position: absolute; inset: 0; border-radius: var(--radius); pointer-events: none;
    box-shadow: 0 0 0 6px rgba(227, 129, 125, .35); opacity: 0;
    animation: glow 2s ease-in-out infinite; will-change: opacity;
  }
  .slot.locked .door .face { filter: saturate(.75); opacity: .85; }
  .slot.shake .door { animation: shake .45s; }
  @keyframes glow { 50% { opacity: 1; } }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-2deg); }
    40% { transform: translateX(6px) rotate(2deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-lurch, .lights span, .slot.today::after { animation: none !important; }
  }

  /* ---------- Popup ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(47, 90, 69, .28);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .card {
    background: var(--white); color: var(--ink);
    max-width: 680px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto;
    border-radius: 28px; padding: 0 26px 22px; text-align: left; position: relative;
    box-shadow: 0 30px 80px rgba(47, 90, 69, .25);
    transform: translateY(24px) scale(.96); transition: transform .4s cubic-bezier(.3,1.4,.5,1);
  }
  .overlay.show .card { transform: none; }
  .card-head {
    text-align: center; margin: 0 -26px 18px; padding: 30px 26px 20px;
    background: linear-gradient(135deg, var(--mint-50), var(--blush-50));
    border-bottom: 1px solid #eef2ef;
  }
  .card .emoji { font-size: 3rem; line-height: 1; }
  .card .date { font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: .75rem; color: var(--red-ink); margin-top: 8px; }
  .card h2 {
    font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; font-weight: 600;
    color: var(--green-ink); font-size: 1.9rem; margin: 4px 0 10px; line-height: 1.15;
  }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip {
    display: inline-block; font-size: .78rem; font-weight: 800;
    color: var(--green-ink); background: var(--mint); padding: 4px 12px; border-radius: 999px;
  }
  .chip.act { color: var(--red-ink); background: var(--blush); }
  .pic { margin: 4px 0 16px; }
  .pic img {
    display: block; width: 100%; height: auto; max-height: 480px; object-fit: cover;
    border-radius: 16px; box-shadow: var(--shadow-soft);
  }
  .pic figcaption { font-size: .85rem; color: var(--muted); text-align: center; margin-top: 6px; font-style: italic; }
  .card-body p { font-size: 1.02rem; line-height: 1.65; margin: 0 0 11px; }
  /* Dialogzeilen: nur der Sprechername ist farbig */
  .line          { --sp: #8a6514; }
  .line.sp-l1    { --sp: var(--red-ink); }
  .line.sp-l2    { --sp: #3f6f86; }
  .line.sp-halbe { --sp: #2f5a45; }
  .card-body .speaker { font-weight: 800; color: var(--sp, var(--red-ink)); }
  .card-body ul { margin: 0 0 12px; padding-left: 22px; line-height: 1.6; }
  .letter {
    font-family: Georgia, 'Times New Roman', serif; font-size: .98rem; line-height: 1.6;
    background: #fffefb;
    border: 1px solid #e3ebe6; border-left: 4px solid var(--rose); border-radius: 12px;
    padding: 16px 20px; margin: 4px 0 14px; box-shadow: var(--shadow-soft);
  }
  /* Hängender Einzug: Umbrüche rücken ein, die Anfangsbuchstaben bleiben eine saubere Spalte */
  .letter div { margin: 0 0 2px; padding-left: 1.4em; text-indent: -1.4em; }
  .letter .sig { margin-top: 6px; font-style: italic; }
  .note {
    background: var(--butter-50); border: 1px solid var(--butter);
    padding: 14px 16px; margin: 4px 0 14px; border-radius: 12px;
    font-style: italic; line-height: 1.6; transform: rotate(-.5deg);
  }
  .note .label { font-style: normal; font-weight: 800; font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; display: block; margin-bottom: 4px; color: #8a6514; }
  .fact {
    background: var(--mint-50); border: 1px solid var(--mint); border-radius: 14px;
    padding: 12px 16px; margin: 10px 0 14px; line-height: 1.6;
  }
  .fact b { display: block; color: var(--green-ink); margin-bottom: 3px; }
  .interaction { margin-top: 20px; border-top: 2px dashed #e6c25a; padding-top: 18px; }
  .interaction h3 {
    font-family: 'Fredoka', 'Nunito', system-ui, sans-serif; font-weight: 600;
    margin: 0 0 8px; font-size: 1.2rem; color: #9a6b00;
  }
  .interaction .q { font-weight: 800; margin: 14px 0 4px; }
  .opt {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--white); color: var(--ink); border: 2px solid #e6ece8; border-radius: 14px;
    padding: 10px 14px; margin: 6px 0; font: inherit; font-weight: 700; line-height: 1.4;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .opt:hover:not([disabled]) { border-color: var(--sage); transform: translateX(2px); }
  .opt[disabled] { cursor: default; }
  .opt.chosen  { border-color: var(--sage); background: var(--mint-50); }
  .opt.correct { border-color: var(--sage); background: var(--mint); }
  .opt.wrong   { border-color: var(--rose-strong); background: var(--blush); }
  .opt.correct::after, .opt.wrong::after { float: right; margin-left: 10px; font-weight: 800; }
  .opt.correct::after { content: "✓"; color: var(--green-ink); }
  .opt.wrong::after   { content: "✗"; color: var(--red-ink); }
  .result {
    background: var(--butter-50); border: 1px solid var(--butter); border-radius: 14px;
    padding: 12px 16px 2px; margin-top: 12px;
  }
  .match-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .match-row span { font-weight: 800; flex: 1 1 160px; }
  .match-row select {
    flex: 1 1 220px; min-width: 0; max-width: 100%;
    font: inherit; padding: 8px 10px; border-radius: 12px; border: 2px solid #e6ece8; background: var(--white); color: var(--ink);
  }
  .match-row select.ok  { border-color: var(--sage); background: var(--mint); }
  .match-row select.bad { border-color: var(--rose-strong); background: var(--blush); }
  .btn {
    background: var(--sage); color: var(--white); border: none;
    padding: 11px 28px; border-radius: 999px; font: inherit; font-weight: 800; cursor: pointer;
    box-shadow: 0 6px 16px rgba(111, 167, 134, .35); transition: background .15s, transform .15s;
  }
  .btn:hover { background: #5b9474; transform: translateY(-1px); }
  .btn.small { padding: 8px 20px; margin-top: 8px; }
  .card-foot { text-align: center; margin-top: 20px; }
  .x {
    position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; z-index: 2;
    border: none; background: rgba(255, 255, 255, .85); color: var(--green-ink); font-size: 1.3rem; cursor: pointer; line-height: 1;
    box-shadow: 0 2px 8px rgba(47, 90, 69, .12);
  }
  .x:hover { background: var(--white); }
  .x:focus-visible, .btn:focus-visible, .opt:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 20;
    transform: translate(-50%, 140px);
    background: var(--white); color: var(--green-ink); font-weight: 800;
    padding: 12px 20px; border-radius: 999px; box-shadow: var(--shadow-lift);
    transition: transform .35s cubic-bezier(.3,1.5,.5,1);
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }

  .previewbar {
    position: relative; z-index: 1; max-width: 960px; margin: 0 auto 18px;
    background: var(--butter); color: #6b4e0f; border-radius: 999px; padding: 8px 10px 8px 18px;
    display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap;
    font-weight: 700; font-size: .9rem; text-align: center;
  }
  .previewbar button {
    background: var(--white); color: #6b4e0f; border: none; border-radius: 999px;
    padding: 6px 14px; font: inherit; font-weight: 800; cursor: pointer;
  }
  footer { text-align: center; color: var(--muted); margin-top: 26px; font-size: .88rem; position: relative; z-index: 1; }
</style>
</head>
<body>

<div class="lights" id="lights"></div>
<canvas id="snow"></canvas>

<header class="hero">
  <img class="hero-lurch l1" src="bilder/lurch-1.webp" alt="Lurch 1 mit Weihnachtsmütze">
  <div class="hero-text">
    <span class="eyebrow">Seerosenhof · Raum 464</span>
    <h1>Two and the half Lurchis<span>Adventskalender</span></h1>
    <p class="subtitle">24 Türchen bis zur Weihnachtsinspektion</p>
    <div class="countdown" id="countdown"></div>
  </div>
  <img class="hero-lurch l2" src="bilder/lurch-2-und-der-halbe.webp" alt="Lurch 2 mit Schal, der Halbe sitzt auf seinem Rücken">
</header>

<div class="previewbar" id="previewbar" hidden>
  <span id="previewtext"></span>
  <button id="resetbtn">Alle Türen wieder schließen</button>
</div>

<div class="cal-wrap">
  <main class="calendar" id="calendar"></main>
</div>

<footer>Tipp: Die Türchen sind gemischt – such die richtige Zahl!</footer>


<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="card" id="card">
    <button class="x" id="m-x" aria-label="Schließen">×</button>
    <div class="card-head">
      <div class="emoji" id="m-emoji"></div>
      <div class="date" id="m-date"></div>
      <h2 id="m-title"></h2>
      <div class="chips" id="m-meta"></div>
    </div>
    <div class="card-body" id="m-body"></div>
    <div class="card-foot"><button class="btn" id="m-close">Schließen</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================
   EINSTELLUNG
   true  = Vorschau: alle Türen lassen sich sofort öffnen
   false = echter Kalender: Türen erst ab ihrem Datum
   ===================================================== */
const ALLE_TUEREN_OFFEN = true;

/* =====================================================
   INHALTE
   Aufbau eines Türchens:
     emoji, title, act, focus
     story: Liste aus
       "Text"                 -> Erzähltext
       ["Sprecher", "Text"]   -> Dialogzeile
       { letter: true }       -> Reihers Brief (siehe LETTER)
       { note: [...], label } -> Zettel / Postkarte
       { fact: "..." }        -> Kasten „Aus dem echten Sumpf“ an dieser Stelle
       { image: "bilder/x.jpg", caption: "..." } -> Bild mitten in der Geschichte

/* Reihenfolge der Türen im Raster (gemischt). Tür 6 und 24 sind groß. */
const ORDER = [7,15,1,24,19,10,4,22,13,2,18,9,21,6,16,11,3,23,14,8,20,5,12,17];
const BIG_DOORS = [24, 6];

/* ===================================================== */

const STORAGE_KEY = "lurchi-teich-adventskalender-geoeffnet";
const params = new URLSearchParams(location.search);
const urlTest = params.has("test");
const preview = ALLE_TUEREN_OFFEN || urlTest;

function today() {
  if (urlTest) {
    const d = parseInt(params.get("test"), 10);
    return { month: 11, day: isNaN(d) ? 24 : d };
  }
  const now = new Date();
  return { month: now.getMonth(), day: now.getDate() };
}
function unlockedUntil() {
  if (ALLE_TUEREN_OFFEN && !urlTest) return 24;
  const t = today();
  if (t.month !== 11) return t.month === 0 ? 24 : 0;
  return Math.min(t.day, 24);
}

function loadOpened() {
  if (preview) return new Set();
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)) || []); }
  catch { return new Set(); }
}
function saveOpened(set) {
  if (preview) return;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...set])); } catch {}
}

const opened = loadOpened();
function isPastDay(n) {
  if (ALLE_TUEREN_OFFEN && !urlTest) return false;
  const t = today();
  return (t.month === 11 && n < t.day) || t.month === 0;
}
const maxDay = unlockedUntil();
const cal = document.getElementById("calendar");

/* Farbvarianten der Türen (wiederholen sich der Reihe nach im Raster) */
const DOOR_COLORS = ["c-mint", "c-blush", "c-white", "c-sky", "c-butter", "c-blush", "c-mint", "c-rose", "c-white", "c-butter", "c-sky", "c-mint"];
/* Unterzeile auf den großen Türen */
const BIG_DOOR_LABELS = { 6: "Nikolaus", 24: "Heiligabend" };

ORDER.forEach((n, idx) => {
  const slot = document.createElement("div");
  slot.className = "slot " + DOOR_COLORS[idx % DOOR_COLORS.length];
  if (BIG_DOORS.includes(n)) slot.classList.add("big", n === 6 ? "b-rose" : "b-mint");
  if (n > maxDay) slot.classList.add("locked");
  if (!ALLE_TUEREN_OFFEN && n === maxDay && today().month === 11) slot.classList.add("today");
  /* Türchen vergangener Tage bleiben automatisch offen (z. B. am 3. sind 1 und 2 offen) */
  if ((opened.has(n) || isPastDay(n)) && n <= maxDay) slot.classList.add("open");

  slot.innerHTML = `
    <div class="inside">${DOORS[n-1].emoji}</div>
    <button class="door" aria-label="Türchen ${n}">
      <span class="face">
        <span class="num">${n}</span>
        ${BIG_DOOR_LABELS[n] ? `<span class="big-label">${BIG_DOOR_LABELS[n]}</span>` : ""}
      </span>
      <span class="back"></span>
    </button>`;
  slot.querySelector(".door").addEventListener("click", () => openDoor(n, slot));
  slot.querySelector(".inside").addEventListener("click", () => { if (slot.classList.contains("open")) showCard(n); });
  cal.appendChild(slot);
});

/* Schwing-Animation auf das eigene Feld begrenzen */
function swing(slot) {
  slot.classList.add("swing");
  clearTimeout(slot._swingT);
  slot._swingT = setTimeout(() => slot.classList.remove("swing"), 1000);
}
function openDoor(n, slot) {
  if (n > maxDay) {
    const t = today();
    const diff = n - (t.month === 11 ? t.day : 0);
    slot.classList.remove("shake"); void slot.offsetWidth; slot.classList.add("shake");
    toast(t.month === 11
      ? `Geduld! Noch ${diff} ${diff === 1 ? "Tag" : "Tage"} bis Türchen ${n} 🦎`
      : `Der Kalender startet am 1. Dezember 🎄`);
    return;
  }
  if (slot.classList.contains("open")) { showCard(n); return; }
  swing(slot);
  slot.classList.add("open");
  slot.classList.remove("today");
  opened.add(n); saveOpened(opened);
  burst(slot);
  setTimeout(() => showCard(n), 750);
}

/* ---------- Popup ---------- */
const overlay = document.getElementById("overlay");
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
/* Dialogzeile mit sprecherabhängiger Farbe */
const SPEAKER_CLASS = { "lurch 1": "sp-l1", "lurch 2": "sp-l2", "der halbe": "sp-halbe" };
function dialogLine(speaker, text) {
  const cls = SPEAKER_CLASS[speaker.trim().toLowerCase()];
  const p = el("p", "line" + (cls ? " " + cls : ""));
  p.appendChild(el("span", "speaker", speaker + ": "));
  p.appendChild(document.createTextNode(text));
  return p;
}
/* Textzeile oder (als Array) Aufzählung */
function textBlock(item) {
  if (item && item.speaker) return dialogLine(item.speaker, item.text);
  if (Array.isArray(item)) {
    const ul = el("ul");
    item.forEach(li => ul.appendChild(el("li", null, li)));
    return ul;
  }
  return el("p", null, item);
}
function letterEl() {
  const box = el("div", "letter");
  LETTER.forEach((line, i) => box.appendChild(el("div", i === LETTER.length - 1 ? "sig" : null, line)));
  return box;
}
function factEl(text) {
  const box = el("div", "fact");
  box.appendChild(el("b", null, "🐸 Aus dem echten Sumpf"));
  box.appendChild(document.createTextNode(text));
  return box;
}
/* Bild mit optionaler Bildunterschrift; fehlt die Datei, wird es einfach ausgeblendet */
function imageEl(src, caption, alt) {
  const fig = el("figure", "pic");
  const img = el("img");
  img.src = src;
  img.alt = alt || caption || "";
  img.loading = "lazy";
  img.onerror = () => fig.remove();
  fig.appendChild(img);
  if (caption) fig.appendChild(el("figcaption", null, caption));
  return fig;
}
function renderStory(box, items) {
  items.forEach(it => {
    if (typeof it === "string") box.appendChild(el("p", null, it));
    else if (it.image) box.appendChild(imageEl(it.image, it.caption, it.alt));
    else if (Array.isArray(it)) box.appendChild(dialogLine(it[0], it[1]));
    else if (it.letter) box.appendChild(letterEl());
    else if (it.fact) box.appendChild(factEl(it.fact));
    else if (it.note) {
      const n = el("div", "note");
      if (it.label) n.appendChild(el("span", "label", it.label));
      it.note.forEach(line => n.appendChild(el("div", null, line)));
      box.appendChild(n);
    }
  });
}

function renderInteraction(box, ia, onDone) {
  const wrap = el("div", "interaction");
  wrap.appendChild(el("h3", null, "Interaktion: " + ia.title));
  (ia.prompt || []).forEach(line => wrap.appendChild(textBlock(line)));
  if (ia.hint) {
    const h = el("div", "note");
    h.appendChild(el("span", "label", "🔎 Hinweis"));
    h.appendChild(document.createTextNode(ia.hint));
    wrap.appendChild(h);
  }
  const result = el("div", "result");
  result.hidden = true;
  const showResult = lines => {
    result.replaceChildren(...lines.filter(Boolean).map(textBlock));
    if (ia.resultLetter) result.appendChild(letterEl());
    result.hidden = false;
    onDone();
  };

  if (ia.kind === "choice") {
    const btns = ia.options.map(opt => {
      const b = el("button", "opt", opt.label);
      b.onclick = () => {
        btns.forEach(x => x.classList.toggle("chosen", x === b));
        showResult([ia.response, opt.response, ia.after]);
      };
      wrap.appendChild(b);
      return b;
    });
  }

  else if (ia.kind === "quiz") {
    let answered = 0, right = 0;
    const feedback = [];
    const graded = ia.questions.filter(q => !q.guess).length;
    ia.questions.forEach(q => {
      if (q.q) wrap.appendChild(el("p", "q", q.q));
      const upper = ia.upper || q.upper;
      const btns = q.options.map((o, i) => {
        const b = el("button", "opt", upper ? String.fromCharCode(65 + i) + ") " + o : String.fromCharCode(97 + i) + ") " + o);
        b.onclick = () => {
          btns.forEach(x => x.disabled = true);
          if (q.guess) b.classList.add("chosen");
          else {
            btns[q.correct].classList.add("correct");
            if (i === q.correct) right++; else b.classList.add("wrong");
          }
          if (q.feedback && q.feedback[i]) feedback.push(q.feedback[i]);
          if (++answered === ia.questions.length) {
            const score = graded > 1 ? `${right} von ${graded} richtig.` : (right ? "Richtig!" : "Leider nicht ganz.");
            showResult([...feedback, score, ...(ia.solution || [])]);
          }
        };
        wrap.appendChild(b);
        return b;
      });
    });
  }

  else if (ia.kind === "match") {
    const lab = (p, i) => ia.hidePlaces ? p : ia.letters ? `${String.fromCharCode(65 + i)}: ${p}` : `${i + 1}. ${p}`;
    if (!ia.hidePlaces) wrap.appendChild(textBlock(ia.places.map(lab)));
    const selects = ia.items.map(item => {
      const row = el("div", "match-row");
      row.appendChild(el("span", null, item.name));
      const s = el("select");
      s.appendChild(new Option(ia.placeholder || (ia.letters ? "– Ende wählen –" : "– Ort wählen –"), ""));
      ia.places.forEach((p, i) => s.appendChild(new Option(lab(p, i), i)));
      row.appendChild(s);
      wrap.appendChild(row);
      return s;
    });
    const check = el("button", "btn small", "Prüfen");
    check.onclick = () => {
      let right = 0;
      selects.forEach((s, i) => {
        const ok = s.value !== "" && +s.value === ia.items[i].answer;
        if (ok) right++;
        s.classList.toggle("ok", ok);
        s.classList.toggle("bad", !ok);
      });
      showResult([`${right} von ${ia.items.length} richtig.`, ...ia.solution]);
    };
    wrap.appendChild(check);
  }

  else if (ia.kind === "order") {
    const picked = [];
    const btns = ia.steps.map((step, i) => {
      const b = el("button", "opt", step);
      b.onclick = () => {
        const pos = picked.indexOf(i);
        if (pos >= 0) picked.splice(pos);          // erneut antippen: ab hier zurücknehmen
        else picked.push(i);
        paint();
        if (picked.length === ia.steps.length) {
          let right = 0;
          picked.forEach((idx, p) => {
            const ok = ia.answer[p] === idx;
            if (ok) right++;
            btns[idx].classList.add(ok ? "correct" : "wrong");
          });
          btns.forEach(x => x.disabled = true);
          retry.hidden = false;
          showResult([`${right} von ${ia.steps.length} an der richtigen Stelle.`, ...ia.solution]);
        }
      };
      wrap.appendChild(b);
      return b;
    });
    const paint = () => btns.forEach((b, i) => {
      const pos = picked.indexOf(i);
      b.textContent = (pos >= 0 ? `${pos + 1}. ` : "") + ia.steps[i];
      b.classList.toggle("chosen", pos >= 0);
    });
    const retry = el("button", "btn small", "Nochmal sortieren");
    retry.hidden = true;
    retry.onclick = () => {
      picked.length = 0;
      btns.forEach(b => { b.disabled = false; b.classList.remove("correct", "wrong"); });
      paint();
      retry.hidden = true;
      result.hidden = true;
    };
    wrap.appendChild(retry);
  }

  else if (ia.kind === "reveal") {
    if (ia.showLetter) wrap.appendChild(letterEl());
    const b = el("button", "btn small", ia.button || "Lösung anzeigen");
    b.onclick = () => { b.remove(); showResult(ia.solution); };
    wrap.appendChild(b);
  }

  else if (ia.kind === "info") {
    if (ia.showLetter) wrap.appendChild(letterEl());
    onDone();
  }

  wrap.appendChild(result);
  box.appendChild(wrap);
}

function showCard(n) {
  const d = DOORS[n-1];
  document.getElementById("m-emoji").textContent = d.emoji;
  document.getElementById("m-date").textContent = `${n}. Dezember`;
  document.getElementById("m-title").textContent = d.placeholder ? `Türchen ${n}` : `Türchen ${n}: ${d.title}`;

  const meta = document.getElementById("m-meta");
  meta.replaceChildren();
  if (d.act) meta.appendChild(el("span", "chip act", d.act));
  if (d.focus) meta.appendChild(el("span", "chip", "Im Mittelpunkt: " + d.focus));

  const body = document.getElementById("m-body");
  body.replaceChildren();
  if (d.placeholder) {
    body.appendChild(el("p", null, "Die Geschichte hinter diesem Türchen wird gerade noch geschrieben. Schau bald wieder vorbei!"));
  } else {
    if (d.image) body.appendChild(imageEl(d.image, d.imageCaption, d.imageAlt || d.title));
    renderStory(body, d.story);
    if (d.fact && !d.factAfter) body.appendChild(factEl(d.fact));
    let factShown = false;
    if (d.interaction) renderInteraction(body, d.interaction, () => {
      if (d.fact && d.factAfter && !factShown) { factShown = true; body.appendChild(factEl(d.fact)); }
    });
  }

  overlay.classList.add("show");
  document.getElementById("card").scrollTop = 0;
  document.getElementById("m-x").focus();
}
function closeCard() { overlay.classList.remove("show"); }
document.getElementById("m-close").onclick = closeCard;
document.getElementById("m-x").onclick = closeCard;
overlay.addEventListener("click", e => { if (e.target === overlay) closeCard(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeCard(); });

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

/* ---------- Countdown ---------- */
(function countdown() {
  const t = today(), el = document.getElementById("countdown");
  if (t.month === 11 && t.day < 24) {
    const left = 24 - t.day;
    el.textContent = `Noch ${left} ${left === 1 ? "Tag" : "Tage"} bis Heiligabend ✨`;
  } else if (t.month === 11 && t.day <= 26) {
    el.textContent = "Frohe Weihnachten! 🎄";
  } else if (t.month < 11 && t.month > 0) {
    const now = new Date(), start = new Date(now.getFullYear(), 11, 1);
    const left = Math.ceil((start - now) / 86400000);
    el.textContent = `Noch ${left} Tage bis zum ersten Türchen`;
  }
})();

/* ---------- Vorschau-Leiste ---------- */
if (preview) {
  document.getElementById("previewbar").hidden = false;
  document.getElementById("previewtext").textContent = urlTest
    ? `Testmodus: simuliert wird der ${maxDay}. Dezember.`
    : "Vorschau: Alle Türen sind offen (nichts wird gespeichert).";
  document.getElementById("resetbtn").onclick = () =>
    document.querySelectorAll(".slot.open").forEach((s, i) => setTimeout(() => { swing(s); s.classList.remove("open"); }, i * 40));
}

/* ---------- Lichterkette ---------- */
(function lights() {
  const box = document.getElementById("lights");
  const count = Math.max(10, Math.floor(innerWidth / 46));
  for (let i = 0; i < count; i++) box.appendChild(document.createElement("span"));
})();

/* ---------- Funkeln beim Öffnen ---------- */
function burst(slot) {
  const r = slot.getBoundingClientRect();
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("div");
    s.textContent = ["✨","❄️","💚","🤍"][i % 4];
    Object.assign(s.style, {
      position: "fixed", left: r.left + r.width/2 + "px", top: r.top + r.height/2 + "px",
      fontSize: (12 + Math.random()*14) + "px", pointerEvents: "none", zIndex: 30,
      transition: "transform .9s ease-out, opacity .9s ease-out"
    });
    document.body.appendChild(s);
    const a = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 80;
    requestAnimationFrame(() => {
      s.style.transform = `translate(${Math.cos(a)*dist}px, ${Math.sin(a)*dist}px) rotate(${Math.random()*360}deg)`;
      s.style.opacity = 0;
    });
    setTimeout(() => s.remove(), 1000);
  }
}

/* ---------- Schneefall ---------- */
(function snow() {
  const c = document.getElementById("snow"), ctx = c.getContext("2d");
  const ov = document.getElementById("overlay");
  let w, h, flakes, running = false, last = 0;
  function resize() {
    w = c.width = innerWidth; h = c.height = innerHeight;
    flakes = Array.from({ length: Math.min(90, Math.floor(w / 12)) }, (_, i) => ({
      x: Math.random()*w, y: Math.random()*h, r: Math.random()*2.6 + 1,
      s: Math.random()*.6 + .25, d: Math.random()*Math.PI*2, c: i % 3
    }));
  }
  /* Pastell-Flocken: Mint, Rosé, Himmelblau */
  const FLAKE_COLORS = ["rgba(159,214,178,.55)", "rgba(240,167,164,.45)", "rgba(169,214,234,.55)"];
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function paint(k) {
    ctx.clearRect(0, 0, w, h);
    FLAKE_COLORS.forEach((col, ci) => {
      ctx.fillStyle = col;
      ctx.beginPath();
      for (const f of flakes) {
        if (f.c !== ci) continue;
        if (k) {
          f.y += f.s * k; f.d += .01 * k; f.x += Math.sin(f.d) * .4 * k;
          if (f.y > h) { f.y = -5; f.x = Math.random()*w; }
        }
        ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      }
      ctx.fill();
    });
  }
  /* Pause, solange ein Türchen offen ist (Schnee liegt dann unter dem Weichzeichner) oder der Tab im Hintergrund ist */
  const paused = () => document.hidden || ov.classList.contains("show");
  function frame(t) {
    if (paused()) { running = false; return; }
    const dt = t - last;
    if (dt >= 15) {                        // höchstens ~60 Bilder pro Sekunde, auch auf 120-Hz-Displays
      paint(Math.min(dt / 16.7, 3));       // gleiche Fallgeschwindigkeit bei jeder Bildrate
      last = t;
    }
    requestAnimationFrame(frame);
  }
  function start() {
    if (still || running || paused()) return;
    running = true; last = performance.now();
    requestAnimationFrame(frame);
  }
  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { resize(); paint(0); }, 150); });
  document.addEventListener("visibilitychange", start);
  new MutationObserver(start).observe(ov, { attributes: true, attributeFilter: ["class"] });
  resize(); paint(0); start();
})();
</script>
